[package]
edition = "2024"
name = "hazard3-st7789v-plot"
version = "0.6.0"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "no_std Cartesian plotting for ST7789V displays in the independent Hazard3 Async ecosystem."
documentation = "https://docs.rs/hazard3-st7789v-plot"
readme = "README.md"
keywords = [
    "hazard3",
    "st7789v",
    "plot",
    "oscilloscope",
    "no-std",
]
categories = [
    "embedded",
    "no-std",
    "hardware-support",
    "visualization",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jorgeandrecastro/hazard3-st7789v-plot"

[lib]
name = "hazard3_st7789v_plot"
path = "src/lib.rs"

[features]
default = ["time-hazard3"]
time-hazard3 = ["hazard3-st7789v/time-hazard3", "hazard3-st7789v-graphics/time-hazard3"]
time-upstream = ["hazard3-st7789v/time-upstream", "hazard3-st7789v-graphics/time-upstream"]

[dependencies.hazard3-st7789v]
version = "0.9"
default-features = false

[dependencies.hazard3-st7789v-graphics]
version = "0.6"
default-features = false

[dependencies.embedded-trig-f32]
version = "0.3"

[dependencies.embedded-hal]
version = "1.0"

[dependencies.embedded-hal-async]
version = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true